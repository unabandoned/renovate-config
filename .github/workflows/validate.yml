name: validate

# Guards the shared Renovate preset: a malformed default.json would halt
# Renovate across every @unabandoned fork that extends it, so validate on
# every PR (and on push to main) with Renovate's own config validator.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate default.json
        run: npx --yes --package renovate -- renovate-config-validator --strict default.json
