name: validate

# Guards the shared Renovate presets: a malformed preset would halt
# Renovate across every @unabandoned fork that extends it, so validate all
# published config files (and this repo's own renovate.json) on every PR
# and push to main with Renovate's own config validator.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict default.json typescript-eslint-compat.json renovate.json
